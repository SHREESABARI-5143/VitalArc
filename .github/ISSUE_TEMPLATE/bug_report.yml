name: 🐛 Bug Report
description: File a bug or unexpected behavior in VitalArc
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing an issue! Please describe the problem in detail.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide reproduction steps.
      placeholder: |
        1. Upload fundus image...
        2. Click 'Analyze Diagnosis'...
        3. See error response...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component Affected
      options:
        - Frontend (React / UI)
        - Backend REST API
        - Deep Learning Model (CNN/SegFormer)
        - Clinical RAG Engine
        - Docker / DevOps
    validations:
      required: true
